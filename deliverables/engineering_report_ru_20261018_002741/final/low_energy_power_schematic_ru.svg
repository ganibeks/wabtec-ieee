0364b" stroke-width="2.4"/><polyline points="380,368 380,535" fill="none" stroke="#20364b" stroke-width="2.4"/><text x="270" y="390" font-size="17" text-anchor="start" fill="#20364b">Cbus 2,2 mF*</text><polyline points="160,245 180,245 180,535 830,535" fill="none" stroke="#20364b" stroke-width="2.4"/><text x="185" y="562" font-size="17" text-anchor="start" fill="#20364b">REF_E: общий вывод вторичной цепи; НЕ обозначение PE</text><rect x="500" y="195" width="80" height="30" fill="white" stroke="#20364b" stroke-width="2"/><polyline points="580,210 635,210" fill="none" stroke="#20364b" stroke-width="2.4"/><path d="M635 210 c0 -28 25 -28 25 0 c0 -28 25 -28 25 0 c0 -28 25 -28 25 0 c0 -28 25 -28 25 0" fill="none" stroke="#20364b" stroke-width="2.4"/><polyline points="735,210 830,210 830,330" fill="none" stroke="#20364b" stroke-width="2.4"/><text x="503" y="263" font-size="17" text-anchor="start" fill="#20364b">Rload 2 Ω*</text><text x="625" y="263" font-size="17" text-anchor="start" fill="#20364b">Lload 1 mH*</text><circle cx="830" cy="210" r="4" fill="#20364b"/><text x="849" y="227" font-size="17" text-anchor="start" fill="#20364b">SW</text><polyline points="830,210 830,122 660,122" fill="none" stroke="#20364b" stroke-width="2.4"/><path d="M660 104 L660 140 L625 122z" fill="white" stroke="#20364b" stroke-width="2.4"/><polyline points="625,99 625,145" fill="none" stroke="#20364b" stroke-width="2.4"/><polyline points="625,122 380,122 380,210" fill="none" stroke="#20364b" stroke-width="2.4"/><text x="460" y="98" font-size="17" text-anchor="start" fill="#20364b">Dfw: анод SW → катод DC+</text><polyline points="450,210 450,320 470,340" fill="none" stroke="#20364b" stroke-width="2.4"/><polyline points="450,350 450,382" fill="none" stroke="#20364b" stroke-width="2.4"/><rect x="436" y="382" width="28" height="65" fill="white" stroke="#20364b" stroke-width="2"/><polyline points="450,447 450,535" fill="none" stroke="#20364b" stroke-width="2.4"/><circle cx="450" cy="535" r="4" fill="#20364b"/><text x="478" y="330" font-size="16" text-anchor="start" fill="#20364b">Kdump NC</text><text x="478" y="423" font-size="16" text-anchor="start" fill="#20364b">Rdump 100 Ω*</text><polyline points="830,330 830,360 805,378" fill="none" stroke="#20364b" stroke-width="2.4"/><polyline points="805,365 805,430" fill="none" stroke="#20364b" stroke-width="2.4"/><polyline points="783,365 783,430" fill="none" stroke="#126b73" stroke-width="2.4"/><polyline points="805,412 830,440 830,535" fill="none" stroke="#20364b" stroke-width="2.4"/><polyline points="811,420 830,440" fill="none" stroke="#20364b" stroke-width="2.4" marker-end="url(#arrow)"/><text x="850" y="353" font-size="18" text-anchor="start" fill="#20364b">C</text><text x="850" y="460" font-size="18" text-anchor="start" fill="#20364b">E / Kelvin E</text><text x="850" y="407" font-size="22" text-anchor="start" fill="#20364b" font-weight="bold">DUT</text><rect x="535" y="345" width="175" height="100" rx="9" fill="#e4f4ef" stroke="#9dabb8" stroke-width="1.4"/><text x="622.5" y="375" font-size="19" text-anchor="middle" fill="#20364b" font-weight="bold">DRIVER</text><text x="622.5" y="400" font-size="19" text-anchor="middle" fill="#20364b" font-weight="bold">+15 / −15 V*</text><polyline points="710,398 783,398" fill="none" stroke="#126b73" stroke-width="2.4"/><text x="732" y="380" font-size="16" text-anchor="start" fill="#20364b">Rg*</text><polyline points="620,445 620,535" fill="none" stroke="#20364b" stroke-width="2.4"/><circle cx="620" cy="535" r="4" fill="#20364b"/><polyline points="830,340 1000,340 1000,485 830,485" fill="none" stroke="#20364b" stroke-width="2.4" stroke-dasharray="7 5"/><rect x="920" y="375" width="150" height="65" rx="9" fill="#f0f5f9" stroke="#9dabb8" stroke-width="1.4"/><text x="995.0" y="405" font-size="18" text-anchor="middle" fill="#20364b" font-weight="bold">VCE diff</text><circle cx="830" cy="298" r="18" fill="white" stroke="#20364b" stroke-width="2"/><text x="830" y="305" font-size="20" text-anchor="middle" fill="#20364b">I</text><text x="862" y="300" font-size="16" text-anchor="start" fill="#20364b">IC → scope</text><rect x="25" y="610" width="390" height="90" rx="9" fill="#f0f5f9" stroke="#9dabb8" stroke-width="1.4"/><text x="220.0" y="640" font-size="16" text-anchor="middle" fill="#20364b" font-weight="bold">SMU: G–E либо C–E</text><text x="220.0" y="662" font-size="16" text-anchor="middle" fill="#20364b" font-weight="bold">только STATIC, силовая цепь отключена</text><rect x="490" y="610" width="570" height="90" rx="9" fill="#f0f5f9" stroke="#9dabb8" stroke-width="1.4"/><text x="775.0" y="640" font-size="16" text-anchor="middle" fill="#20364b" font-weight="bold">Блокировка: E-stop / дверь → gate inhibit + charger OFF</text><text x="775.0" y="662" font-size="16" text-anchor="middle" fill="#20364b" font-weight="bold">Измерить Vbus до отпирания фиксатора</text><text x="775.0" y="684" font-size="16" text-anchor="middle" fill="#20364b" font-weight="bold">PE подключён к корпусу, отдельно от REF_E</text><text x="25" y="735" font-size="15" text-anchor="start" fill="#20364b">* Драйвер, ток, напряжение, R/L/C и защита выбираются после идентификации DUT; общий для всех модулей порог не задан.</text></svg>