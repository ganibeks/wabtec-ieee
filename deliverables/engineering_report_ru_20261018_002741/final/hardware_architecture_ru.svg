="bold">DUT: один IGBT</text><text x="922.5" y="306" font-size="20" text-anchor="middle" fill="#20364b" font-weight="bold">C / G / E или OEM-порты</text><polyline points="920,155 920,250" fill="none" stroke="#20364b" stroke-width="2.4" marker-end="url(#arrow)"/><text x="935" y="208" font-size="17" text-anchor="start" fill="#20364b">G–E, ±15 V*</text><rect x="25" y="255" width="270" height="95" rx="9" fill="#f0f5f9" stroke="#9dabb8" stroke-width="1.4"/><text x="160.0" y="285" font-size="20" text-anchor="middle" fill="#20364b" font-weight="bold">48 V, Cbus, R–L</text><text x="160.0" y="311" font-size="20" text-anchor="middle" fill="#20364b" font-weight="bold">заряд / разряд / диод</text><polyline points="295,300 780,300" fill="none" stroke="#20364b" stroke-width="2.4" marker-end="url(#arrow)"/><text x="395" y="280" font-size="18" text-anchor="start" fill="#20364b">ограниченный по энергии стимул</text><rect x="390" y="440" width="330" height="90" rx="9" fill="#f0f5f9" stroke="#9dabb8" stroke-width="1.4"/><text x="555.0" y="470" font-size="20" text-anchor="middle" fill="#20364b" font-weight="bold">Осциллограф + щупы</text><text x="555.0" y="496" font-size="20" text-anchor="middle" fill="#20364b" font-weight="bold">быстрые VGE / VCE / IC</text><rect x="25" y="440" width="270" height="90" rx="9" fill="#f0f5f9" stroke="#9dabb8" stroke-width="1.4"/><text x="160.0" y="470" font-size="20" text-anchor="middle" fill="#20364b" font-weight="bold">SMU + DMM</text><text x="160.0" y="496" font-size="20" text-anchor="middle" fill="#20364b" font-weight="bold">статика / малые токи</text><polyline points="870,345 870,410 720,475" fill="none" stroke="#20364b" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#arrow)"/><polyline points="780,330 325,330 325,475 295,475" fill="none" stroke="#20364b" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#arrow)"/><polyline points="390,485 345,485 345,180 150,180 150,155" fill="none" stroke="#20364b" stroke-width="2.4" stroke-dash