<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Times New Roman', Times, serif" fill="none" stroke="#000">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000" stroke="none"/>
    </marker>
    <style>
      .blk  { stroke:#000; stroke-width:1.4; fill:#fff; }
      .sub  { stroke:#000; stroke-width:1.1; fill:#fff; }
      .pwr  { stroke:#000; stroke-width:2.6; fill:none; }
      .ctl  { stroke:#000; stroke-width:1.2; fill:none; }
      .flt  { stroke:#000; stroke-width:2.0; fill:none; }
      .msr  { stroke:#000; stroke-width:1.2; fill:none; stroke-dasharray:6 4; }
      .bar  { stroke:#000; stroke-width:1.1; fill:none; stroke-dasharray:10 3 2 3; }
      .dut  { stroke:#000; stroke-width:1.1; fill:none; stroke-dasharray:9 5; }
      .t    { fill:#000; stroke:none; font-size:15px; }
      .tb   { fill:#000; stroke:none; font-size:16px; font-weight:bold; letter-spacing:0.3px; }
      .ts   { fill:#000; stroke:none; font-size:13px; }
      .ti   { fill:#000; stroke:none; font-size:13px; font-style:italic; }
      .dot  { fill:#000; stroke:none; }
      .term { fill:#fff; stroke:#000; stroke-width:1.2; }
      .num  { fill:#fff; stroke:#000; stroke-width:1.2; }
      .numt { fill:#000; stroke:none; font-size:12px; font-weight:bold; }
    </style>
  </defs>
  <rect x="0" y="0" width="1600" height="900" fill="#fff" stroke="none"/>

  <!-- ===== DOMAIN LABELS ===== -->
  <text class="tb" x="785" y="24" text-anchor="end">DOMAIN A</text>
  <text class="tb" x="815" y="24">DOMAIN B</text>

  <!-- ===== 1. POWER SUPPLY ===== -->
  <text class="ts" x="6" y="80">~230 V</text>
  <line class="ctl" x1="6" y1="88" x2="40" y2="88" stroke-width="1.6"/>
  <rect class="blk" x="40" y="55" width="210" height="70"/>
  <text class="tb" x="145" y="80" text-anchor="middle">POWER SUPPLY</text>
  <text class="t"  x="145" y="100" text-anchor="middle">AC/DC  ~230 V / =24 V</text>
  <line class="ctl" x1="250" y1="88" x2="720" y2="88" stroke-width="1.6" marker-end="url(#arr)"/>
  <text class="t" x="270" y="81">+24 V</text>

  <line class="ctl" x1="145" y1="125" x2="145" y2="160" stroke-width="1.6"/>
  <rect class="blk" x="40" y="160" width="210" height="55"/>
  <text class="tb" x="145" y="184" text-anchor="middle">DC/DC  =24 V / 3.3 V</text>
  <text class="ti" x="145" y="203" text-anchor="middle">MCU and logic supply</text>
  <polyline class="ctl" points="250,188 400,188 400,250" stroke-width="1.6" marker-end="url(#arr)"/>
  <polyline class="ctl" points="400,188 750,188 750,240" stroke-width="1.6" marker-end="url(#arr)"/>
  <circle class="dot" cx="400" cy="188" r="3.2"/>
  <text class="t" x="270" y="181">+3.3 V</text>

  <!-- isolated DC/DC straddling the barrier -->
  <rect class="blk" x="720" y="60" width="170" height="80"/>
  <text class="tb" x="712" y="78" text-anchor="end">ISOLATED DC/DC</text>
  <text class="t"  x="758" y="96" text-anchor="middle">=24 V</text>
  <text class="t"  x="848" y="96" text-anchor="middle">+15 V</text>
  <text class="t"  x="848" y="114" text-anchor="middle">−15 V</text>
  <line class="ctl" x1="860" y1="140" x2="860" y2="240" stroke-width="1.6" marker-end="url(#arr)"/>
  <text class="t" x="868" y="200">±15 V (isolated)</text>

  <!-- ===== 2. STM32 ===== -->
  <rect class="blk" x="300" y="250" width="200" height="560"/>
  <text class="tb" x="400" y="610" text-anchor="middle">STM32</text>
  <text class="tb" x="400" y="630" text-anchor="middle">MICROCONTROLLER</text>
  <text class="ti" x="400" y="652" text-anchor="middle">test sequencer, timers,</text>
  <text class="ti" x="400" y="668" text-anchor="middle">ADC, USB, fault log</text>
  <text class="ts" x="492" y="294" text-anchor="end">ENABLE</text>
  <text class="ts" x="492" y="324" text-anchor="end">PWM / TEST PULSE</text>
  <text class="ts" x="492" y="509" text-anchor="end">FAULT (EXTI)</text>
  <text class="ts" x="492" y="539" text-anchor="end">LATCH RESET</text>
  <text class="ts" x="492" y="719" text-anchor="end">ADC1</text>
  <text class="ts" x="492" y="749" text-anchor="end">ADC2</text>
  <text class="ts" x="492" y="779" text-anchor="end">ADC3</text>
  <text class="ts" x="308" y="724">USB</text>
  <line class="ctl" x1="400" y1="810" x2="400" y2="828"/>
  <line class="ctl" x1="386" y1="828" x2="414" y2="828" stroke-width="1.6"/>
  <line class="ctl" x1="391" y1="834" x2="409" y2="834" stroke-width="1.4"/>
  <line class="ctl" x1="396" y1="840" x2="404" y2="840" stroke-width="1.2"/>

  <!-- ===== 7. PC ===== -->
  <rect class="blk" x="40" y="650" width="210" height="140"/>
  <text class="tb" x="145" y="676" text-anchor="middle">PC / LAPTOP</text>
  <text class="t" x="55" y="701">• test configuration</text>
  <text class="t" x="55" y="723">• data acquisition</text>
  <text class="t" x="55" y="745">• results visualization</text>
  <text class="t" x="55" y="767">• PASS / FAIL report</text>
  <line class="ctl" x1="250" y1="720" x2="300" y2="720" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text class="t" x="275" y="712" text-anchor="middle">USB</text>

  <!-- ===== PWM interlock (AND) ===== -->
  <line class="ctl" x1="500" y1="290" x2="720" y2="290" marker-end="url(#arr)"/>
  <line class="ctl" x1="500" y1="320" x2="600" y2="320" marker-end="url(#arr)"/>
  <rect class="blk" x="600" y="305" width="50" height="50"/>
  <text class="tb" x="625" y="336" text-anchor="middle">&amp;</text>
  <line class="ctl" x1="650" y1="330" x2="720" y2="330" marker-end="url(#arr)"/>

  <!-- ===== 3. GATE DRIVER (straddles barrier) ===== -->
  <rect class="blk" x="720" y="240" width="280" height="220"/>
  <text class="tb" x="878" y="234">GATE DRIVER</text>
  <text class="ts" x="726" y="285">EN</text>
  <text class="ts" x="726" y="345">IN</text>
  <text class="ts" x="766" y="452">FLT</text>
  <text class="ts" x="994" y="324" text-anchor="end">OUT</text>
  <text class="ts" x="994" y="386" text-anchor="end">DESAT</text>
  <text class="ts" x="994" y="436" text-anchor="end">E</text>
  <!-- secondary-side blocks -->
  <rect class="sub" x="828" y="300" width="130" height="50"/>
  <text class="ts" x="893" y="321" text-anchor="middle">OUTPUT STAGE</text>
  <text class="ts" x="893" y="338" text-anchor="middle">+15 V / −15 V, soft-off</text>
  <rect class="sub" x="828" y="372" width="120" height="50"/>
  <text class="ts" x="888" y="393" text-anchor="middle">DESAT DETECTOR</text>
  <text class="ts" x="888" y="410" text-anchor="middle" font-size="12">V<tspan font-size="10" dy="3">CE(on)</tspan><tspan dy="-3"> &gt; V</tspan><tspan font-size="10" dy="3">th</tspan><tspan dy="-3">, blanking</tspan></text>
  <!-- internal signals -->
  <polyline class="ctl" points="720,290 870,290 870,300" marker-end="url(#arr)"/>
  <line class="ctl" x1="720" y1="330" x2="828" y2="330" marker-end="url(#arr)"/>
  <line class="ctl" x1="958" y1="325" x2="1000" y2="325"/>
  <line class="ctl" x1="1000" y1="392" x2="948" y2="392" marker-end="url(#arr)"/>
  <line class="flt" x1="910" y1="372" x2="910" y2="350" marker-end="url(#arr)"/>
  <polyline class="flt" points="828,405 760,405 760,480" marker-end="url(#arr)"/>
  
  <!-- ===== 6. PROTECTION (domain A) ===== -->
  <rect class="blk" x="560" y="480" width="210" height="80"/>
  <text class="tb" x="665" y="499" text-anchor="middle">FAULT LATCH (HW)</text>
  <text class="ts" x="572" y="518">FLT OR overcurrent → latched</text>
  <text class="ts" x="572" y="535">blocks PWM via &amp; gate</text>
  <text class="ts" x="572" y="552">cleared only by LATCH RESET</text>
  <line class="flt" x1="625" y1="480" x2="625" y2="355" marker-end="url(#arr)"/>
  <text class="ts" x="631" y="420">PWM_EN</text>
  <line class="flt" x1="560" y1="505" x2="500" y2="505" marker-end="url(#arr)"/>
  <line class="ctl" x1="500" y1="535" x2="560" y2="535" marker-end="url(#arr)"/>

  <rect class="blk" x="585" y="600" width="200" height="50"/>
  <text class="ts" x="685" y="620" text-anchor="middle">OVERCURRENT COMPARATOR</text>
  <text class="ts" x="685" y="638" text-anchor="middle">I<tspan font-size="10" dy="3">C</tspan><tspan dy="-3"> &gt; I</tspan><tspan font-size="10" dy="3">lim</tspan></text>
  <line class="flt" x1="700" y1="600" x2="700" y2="560" marker-end="url(#arr)"/>
  <text class="ts" x="706" y="586">OC</text>

  <!-- ===== 4. DUT ===== -->
  <!-- DESAT sense to collector, with blocking diode and hop over gate line -->
  <polyline class="ctl" points="1000,392 1015,392 1015,336"/>
  <path class="ctl" d="M1015,336 A6,6 0 0 0 1015,324"/>
  <line class="ctl" x1="1015" y1="324" x2="1015" y2="292"/>
  <path d="M1006,292 L1024,292 L1015,274 z" fill="#fff" stroke="#000" stroke-width="1.2"/>
  <line class="ctl" x1="1005" y1="274" x2="1025" y2="274" stroke-width="1.6"/>
  <polyline class="ctl" points="1015,274 1015,250 1165,250"/>
  <circle class="dot" cx="1165" cy="250" r="3"/>
  <text class="ts" x="1030" y="270">D<tspan font-size="10" dy="3">DESAT</tspan></text>

  <!-- gate via RG -->
  <line class="ctl" x1="1000" y1="330" x2="1030" y2="330" stroke-width="1.6"/>
  <rect class="sub" x="1030" y="322" width="34" height="16"/>
  <text class="ts" x="1047" y="316" text-anchor="middle">R<tspan font-size="10" dy="3">G</tspan></text>
  <line class="ctl" x1="1064" y1="330" x2="1105" y2="330" stroke-width="1.6"/>
  <!-- Kelvin emitter -->
  <line class="ctl" x1="1000" y1="430" x2="1105" y2="430" stroke-width="1.6"/>

  <rect class="dut" x="1105" y="270" width="165" height="175"/>
  <text class="tb" x="1174" y="464" font-size="13">IGBT UNDER TEST (DUT)</text>
  <circle class="term" cx="1105" cy="330" r="3.5"/>
  <circle class="term" cx="1105" cy="430" r="3.5"/>
  <text class="ts" x="1111" y="324">G</text>
  <text class="ts" x="1111" y="424">E<tspan font-size="10" dy="3">aux</tspan></text>
  <line class="ctl" x1="1108" y1="430" x2="1165" y2="430"/>
  <circle class="dot" cx="1165" cy="430" r="3"/>
  <!-- IGBT symbol -->
  <line class="ctl" x1="1108" y1="330" x2="1128" y2="330" stroke-width="1.6"/>
  <line class="ctl" x1="1128" y1="305" x2="1128" y2="355" stroke-width="1.8"/>
  <line class="ctl" x1="1137" y1="300" x2="1137" y2="360" stroke-width="3"/>
  <line class="pwr" x1="1137" y1="315" x2="1165" y2="296"/>
  <line class="pwr" x1="1165" y1="296" x2="1165" y2="270"/>
  <line class="pwr" x1="1137" y1="345" x2="1165" y2="364"/>
  <path d="M1165,364 L1151,363 L1158,353 z" fill="#000" stroke="none"/>
  <line class="pwr" x1="1165" y1="364" x2="1165" y2="445"/>
  <text class="t" x="1176" y="300">C</text>
  <text class="t" x="1176" y="372">E</text>
  <!-- anti-parallel diode -->
  <line class="ctl" x1="1165" y1="284" x2="1235" y2="284" stroke-width="1.6"/>
  <line class="ctl" x1="1235" y1="284" x2="1235" y2="335" stroke-width="1.6"/>
  <line class="ctl" x1="1224" y1="335" x2="1246" y2="335" stroke-width="1.8"/>
  <path d="M1225,355 L1245,355 L1235,335 z" fill="#fff" stroke="#000" stroke-width="1.3"/>
  <line class="ctl" x1="1235" y1="355" x2="1235" y2="415" stroke-width="1.6"/>
  <line class="ctl" x1="1235" y1="415" x2="1165" y2="415" stroke-width="1.6"/>
  <circle class="dot" cx="1165" cy="284" r="3"/>
  <circle class="dot" cx="1165" cy="415" r="3"/>
  <circle class="term" cx="1165" cy="270" r="4"/>
  <circle class="term" cx="1165" cy="445" r="4"/>

  <!-- power path to conceptual source -->
  <polyline class="pwr" points="1165,266 1165,230 1400,230"/>
  <polyline class="pwr" points="1165,449 1165,490 1400,490"/>
  <rect class="blk" x="1400" y="205" width="160" height="310"/>
  <text class="tb" x="1480" y="290" text-anchor="middle">TEST ENERGY</text>
  <text class="tb" x="1480" y="310" text-anchor="middle">SOURCE &amp;</text>
  <text class="tb" x="1480" y="330" text-anchor="middle">TEST LOAD</text>
  <text class="ti" x="1480" y="354" text-anchor="middle">(conceptual)</text>
  <text class="ts" x="1480" y="382" text-anchor="middle">controlled,</text>
  <text class="ts" x="1480" y="398" text-anchor="middle">current-limited,</text>
  <text class="ts" x="1480" y="414" text-anchor="middle">interlocked,</text>
  <text class="ts" x="1480" y="430" text-anchor="middle">auto-discharge</text>
  <text class="t" x="1408" y="237">+</text>
  <text class="t" x="1408" y="496">−</text>
  <!-- current sensor -->
  <circle cx="1210" cy="490" r="10" fill="#fff" stroke="#000" stroke-width="1.3"/>
  <line class="pwr" x1="1196" y1="490" x2="1224" y2="490"/>

  <!-- ===== 5. MEASUREMENT: sensors (domain B) ===== -->
  <rect class="dut" x="1020" y="560" width="500" height="108"/>
  <text class="tb" x="1270" y="580" text-anchor="middle" font-size="14">MEASUREMENT SENSORS (domain B)</text>
  <rect class="sub" x="1035" y="600" width="130" height="55"/>
  <text class="t"  x="1100" y="622" text-anchor="middle">V<tspan font-size="11" dy="3">GE</tspan><tspan dy="-3"> sensing</tspan></text>
  <text class="ts" x="1100" y="643" text-anchor="middle">differential amp.</text>
  <rect class="sub" x="1180" y="600" width="130" height="55"/>
  <text class="t"  x="1245" y="622" text-anchor="middle">I<tspan font-size="11" dy="3">C</tspan><tspan dy="-3"> sensing</tspan></text>
  <text class="ts" x="1245" y="643" text-anchor="middle">current sensor + amp.</text>
  <rect class="sub" x="1325" y="600" width="180" height="55"/>
  <text class="t"  x="1415" y="622" text-anchor="middle">V<tspan font-size="11" dy="3">CE</tspan><tspan dy="-3"> sensing</tspan></text>
  <text class="ts" x="1415" y="643" text-anchor="middle">HV differential divider</text>

  <!-- taps -->
  <circle class="dot" cx="1078" cy="330" r="3"/>
  <path class="msr" d="M1078,330 L1078,424 A6,6 0 0 1 1078,436 L1078,600"/>
  <circle class="dot" cx="1092" cy="430" r="3"/>
  <line class="msr" x1="1092" y1="430" x2="1092" y2="600"/>
  <line class="msr" x1="1210" y1="500" x2="1210" y2="600"/>
  <circle class="dot" cx="1350" cy="230" r="3"/>
  <path class="msr" d="M1350,230 L1350,484 A6,6 0 0 1 1350,496 L1350,600"/>
  <circle class="dot" cx="1375" cy="490" r="3"/>
  <line class="msr" x1="1375" y1="490" x2="1375" y2="600"/>

  <!-- sensors -> isolation amplifiers -->
  <polyline class="msr" points="1100,655 1100,715 880,715" marker-end="url(#arr)"/>
  <polyline class="msr" points="1245,655 1245,745 880,745" marker-end="url(#arr)"/>
  <polyline class="msr" points="1415,655 1415,775 880,775" marker-end="url(#arr)"/>

  <!-- isolation amplifiers straddling barrier -->
  <rect class="blk" x="720" y="695" width="160" height="100"/>
  <text class="tb" x="888" y="690" font-size="14">ISOLATION AMPLIFIERS</text>
  <text class="ts" x="758" y="740" text-anchor="middle">filter,</text>
  <text class="ts" x="758" y="756" text-anchor="middle">scaling</text>
  <text class="ts" x="842" y="740" text-anchor="middle">input</text>
  <text class="ts" x="842" y="756" text-anchor="middle">stage</text>

  <!-- iso amps -> STM32 ADC -->
  <line class="msr" x1="720" y1="715" x2="500" y2="715" marker-end="url(#arr)"/>
  <path class="msr" d="M720,745 L500,745" marker-end="url(#arr)"/>
  <line class="msr" x1="720" y1="775" x2="500" y2="775" marker-end="url(#arr)"/>
  <text class="ts" x="560" y="710">V<tspan font-size="10" dy="3">GE</tspan></text>
  <text class="ts" x="560" y="740">I<tspan font-size="10" dy="3">C</tspan></text>
  <text class="ts" x="560" y="770">V<tspan font-size="10" dy="3">CE</tspan></text>
  <!-- IC to overcurrent comparator (hop over VGE line) -->
  <circle class="dot" cx="650" cy="745" r="3"/>
  <path class="msr" d="M650,745 L650,721 A6,6 0 0 1 650,709 L650,650" marker-end="url(#arr)"/>

  <!-- ===== ISOLATION BARRIER (continuous) ===== -->
  <line class="bar" x1="797" y1="46" x2="797" y2="815"/>
  <line class="bar" x1="803" y1="46" x2="803" y2="815"/>

  <!-- ===== FAULT-CHAIN STEP MARKERS ===== -->
  <circle class="num" cx="845" cy="442" r="9"/><text class="numt" x="845" y="446" text-anchor="middle">1</text>
  <circle class="num" cx="927" cy="362" r="9"/><text class="numt" x="927" y="366" text-anchor="middle">2</text>
  <circle class="num" cx="778" cy="423" r="9"/><text class="numt" x="778" y="427" text-anchor="middle">3</text>
  <circle class="num" cx="645" cy="452" r="9"/><text class="numt" x="645" y="456" text-anchor="middle">4</text>
  <circle class="num" cx="530" cy="474" r="9"/><text class="numt" x="530" y="478" text-anchor="middle">5</text>

  <!-- ===== FAULT CHAIN NOTE ===== -->
  <rect class="sub" x="1050" y="58" width="510" height="140"/>
  <text class="tb" x="1062" y="78" font-size="14">SHORT-CIRCUIT / DESAT RESPONSE CHAIN</text>
  <g class="ts">
    <circle class="num" cx="1071" cy="95" r="8"/><text class="numt" x="1071" y="99" text-anchor="middle">1</text>
    <text class="ts" x="1086" y="99">Driver detects desaturation on the isolated side (after blanking time).</text>
    <circle class="num" cx="1071" cy="117" r="8"/><text class="numt" x="1071" y="121" text-anchor="middle">2</text>
    <text class="ts" x="1086" y="121">Driver turns the IGBT off by itself (soft turn-off), no MCU in the loop.</text>
    <circle class="num" cx="1071" cy="139" r="8"/><text class="numt" x="1071" y="143" text-anchor="middle">3</text>
    <text class="ts" x="1086" y="143">FLT crosses the isolation barrier inside the driver.</text>
    <circle class="num" cx="1071" cy="161" r="8"/><text class="numt" x="1071" y="165" text-anchor="middle">4</text>
    <text class="ts" x="1086" y="165">HW latch blocks PWM (&amp; gate); overcurrent (OC) uses the same latch.</text>
    <circle class="num" cx="1071" cy="183" r="8"/><text class="numt" x="1071" y="187" text-anchor="middle">5</text>
    <text class="ts" x="1086" y="187">STM32 gets FAULT interrupt, logs timing, resets latch after inspection.</text>
  </g>

  <!-- ===== LEGEND ===== -->
  <g transform="translate(40,862)">
    <line class="pwr" x1="0" y1="0" x2="36" y2="0"/>
    <text class="ts" x="42" y="5">power path (conceptual)</text>
    <line class="ctl" x1="190" y1="0" x2="226" y2="0" marker-end="url(#arr)"/>
    <text class="ts" x="232" y="5">control signal</text>
    <line class="flt" x1="330" y1="0" x2="366" y2="0" marker-end="url(#arr)"/>
    <text class="ts" x="372" y="5">fault / protection signal</text>
    <line class="msr" x1="520" y1="0" x2="556" y2="0"/>
    <text class="ts" x="562" y="5">measurement signal</text>
    <line class="bar" x1="690" y1="-3" x2="726" y2="-3"/><line class="bar" x1="690" y1="3" x2="726" y2="3"/>
    <text class="ts" x="732" y="5">isolation boundary</text>
    <rect class="dut" x="850" y="-7" width="36" height="14"/>
    <text class="ts" x="892" y="5">DUT / sensor group</text>
    <line class="ctl" x1="1020" y1="0" x2="1040" y2="0"/><path class="ctl" d="M1030,-6 A6,6 0 0 1 1030,6"/>
    <text class="ts" x="1046" y="5">crossing, not connected</text>
  </g>
  <text class="t" x="40" y="890">Fig. 1.  Functional block diagram of the STM32-based IGBT test system (conceptual architecture; not a construction drawing).</text>
</svg>
